spring:
  application:
    name: finance-guide-backend

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  health:
    redis:
      enabled: false

ddd:
  demo-bank:
    enabled: ${DDD_DEMO_BANK_ENABLED:false}
    base-url: ${DEMO_BANK_BASE_URL:http://127.0.0.1:5190}

  frame-websocket:
    allowed-origins: ${DDD_FRAME_WS_ALLOWED_ORIGINS:http://127.0.0.1:5173}

  rest-cors:
    allowed-origins: ${DDD_REST_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173}