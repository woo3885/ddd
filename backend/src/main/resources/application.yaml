spring:
  application:
    name: finance-guide-backend

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  health:
    redis:
      enabled: false

ddd:
  session-store:
    type: ${DDD_SESSION_STORE_TYPE:memory}

    # D8
    # 마지막 save 이후 세션 유지 시간.
    ttl: ${DDD_SESSION_TTL:30m}

    # D8
    # Redis TTL이 끝난 BrowserSession을
    # 찾아 정리하는 주기.
    cleanup-interval-ms: ${DDD_SESSION_CLEANUP_INTERVAL_MS:5000}

  demo-bank:
    enabled: ${DDD_DEMO_BANK_ENABLED:false}
    base-url: ${DEMO_BANK_BASE_URL:http://127.0.0.1:5190}

  frame-websocket:
    allowed-origins: ${DDD_FRAME_WS_ALLOWED_ORIGINS:http://127.0.0.1:5173}

  rest-cors:
    allowed-origins: ${DDD_REST_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173}

  ai:
    engine:
      enabled: ${DDD_AI_ENGINE_ENABLED:true}
      endpoint: ${AI_ENGINE_ENDPOINT:http://127.0.0.1:3001/api/ai/action}
      connect-timeout: ${AI_ENGINE_CONNECT_TIMEOUT:3s}
      request-timeout: ${AI_ENGINE_REQUEST_TIMEOUT:15s}